dataset:
  name: rfdetr_inner_wall_baseline
  dir: data/rfdetr_inner_wall_all_non_legacy_test_v1
  source_yolo_dataset: final_download_20260526/handoff_20260519/shimizu_20260519_minimal_repro_package/data/final_crack_yolo_20260519/split/inner_wall
  note: Inner-wall single-component crack/damage B/C/D dataset with data_split.json official test.

classes:
  0: 内壁の損傷程度B
  1: 内壁の損傷程度C
  2: 内壁の損傷程度D

selection_policy:
  primary_metric: test/recall
  official_targets:
    overall_recall: 0.750
    B_recall: 0.747
    C_recall: 0.773
    D_recall: 0.800
  guardrail_metrics:
    - test/mAP_50
    - test/mAP_50_95
    - test/precision
    - per_class_B_recall
    - per_class_C_recall
    - per_class_D_recall
    - false_negative_count

training_defaults:
  epochs: 80
  num_workers: 8
  eval_interval: 1
  checkpoint_interval: 1
  tensorboard: true
  wandb: false
  run_test: true
  test_each_epoch: false
  save_epoch_pth: true
  trainer_precision: 16-mixed

experiments:
  small:
    model_size: small
    batch_size: 8
    grad_accum_steps: 2
    lr: 0.0001
    output_dir: outputs/rfdetr_single_crack/inner_wall_small_all_non_legacy_test_v1
  medium:
    model_size: medium
    batch_size: 28
    grad_accum_steps: 1
    lr: 0.0001
    output_dir: outputs/rfdetr_single_crack/inner_wall_medium_all_non_legacy_test_v1
