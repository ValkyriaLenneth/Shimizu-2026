dataset:
  name: rfdetr_tenjo_baseline
  dir: data/rfdetr_tenjo_all_non_legacy_test_v1
  source_yolo_dataset: final_download_20260526/handoff_20260519/shimizu_20260519_minimal_repro_package/data/final_crack_yolo_20260519/split/tenjo
  note: Tenjo single-component crack/damage B/C/D dataset with data_split.json official test.

classes:
  0: 天井の損傷程度B
  1: 天井の損傷程度C
  2: 天井の損傷程度D

selection_policy:
  primary_metric: test/recall
  official_targets:
    overall_recall: 0.845
    B_recall: 0.750
    C_recall: 0.826
    D_recall: 1.000
  guardrail_metrics:
    - test/mAP_50
    - test/mAP_50_95
    - test/precision
    - per_class_B_recall
    - per_class_C_recall
    - per_class_D_recall
    - false_negative_count

training_defaults:
  epochs: 80
  num_workers: 8
  eval_interval: 1
  checkpoint_interval: 1
  tensorboard: true
  wandb: false
  run_test: true
  test_each_epoch: false
  save_epoch_pth: true
  trainer_precision: 16-mixed
  external_eval_profiles:
    - name: operating
      thresholds: "0.20"
      selected_threshold: 0.20
      selection: threshold
      iou_threshold: 0.229
      device: cpu
      split: test
      num_classes: 3
    - name: report
      thresholds: "0.01"
      selected_threshold: 0.01
      selection: threshold
      iou_threshold: 0.229
      device: cpu
      split: test
      num_classes: 3

experiments:
  small:
    model_size: small
    batch_size: 8
    grad_accum_steps: 2
    lr: 0.0001
    output_dir: outputs/rfdetr_single_crack/tenjo_small_all_non_legacy_test_v1
  medium:
    model_size: medium
    batch_size: 28
    grad_accum_steps: 1
    lr: 0.0001
    output_dir: outputs/rfdetr_single_crack/tenjo_medium_all_non_legacy_test_v1
