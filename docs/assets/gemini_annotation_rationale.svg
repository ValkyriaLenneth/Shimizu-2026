<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f7f8fa"/>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2933">Why Gemini coarse annotation is acceptable for this stage</text>
  <text x="64" y="116" font-family="Arial, sans-serif" font-size="19" fill="#52606d">The router only needs to select the right downstream model. Exact crack-level boundaries are not required here.</text>

  <rect x="70" y="168" width="520" height="360" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="102" y="214" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933">Tolerance of router labels</text>
  <rect x="142" y="270" width="360" height="160" fill="#eef2f7" stroke="#cbd5e1"/>
  <rect x="190" y="300" width="260" height="92" fill="none" stroke="#7bc79a" stroke-width="8"/>
  <rect x="170" y="288" width="298" height="122" fill="none" stroke="#f2b46d" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="176" y="462" font-family="Arial, sans-serif" font-size="17" fill="#52606d">Green: ideal region. Orange: acceptable coarse region.</text>
  <text x="102" y="500" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">For routing, both send the crop to the same specialist model.</text>

  <rect x="690" y="168" width="520" height="360" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="722" y="214" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933">Observed LLM limitations</text>
  <circle cx="744" cy="272" r="6" fill="#a23b3b"/>
  <text x="764" y="279" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">Confusion between visually similar categories</text>
  <text x="764" y="306" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Example: inner wall vs RC wall required post-processing fixes.</text>
  <circle cx="744" cy="358" r="6" fill="#a23b3b"/>
  <text x="764" y="365" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">Boxes are sometimes loose or incomplete</text>
  <text x="764" y="392" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Acceptable for routing, not acceptable as final damage annotations.</text>
  <circle cx="744" cy="444" r="6" fill="#a23b3b"/>
  <text x="764" y="451" font-family="Arial, sans-serif" font-size="18" fill="#1f2933">Needs QA and rules around edge cases</text>
  <text x="764" y="478" font-family="Arial, sans-serif" font-size="16" fill="#52606d">Low-confidence regions should be checked or routed to multiple models.</text>

  <rect x="178" y="584" width="924" height="58" rx="8" fill="#e7f7ee" stroke="#7bc79a"/>
  <text x="218" y="620" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933">Conclusion: use Gemini to bootstrap coarse labels, then let YOLO learn a stable, fast router.</text>
</svg>
