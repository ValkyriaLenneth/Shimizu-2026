<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f7f8fa"/>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2933">Proposed inference flow: coarse router + specialist models</text>
  <text x="64" y="116" font-family="Arial, sans-serif" font-size="19" fill="#52606d">The coarse detector is not the final damage judge. Its role is to split the image into likely building-element regions.</text>

  <rect x="64" y="210" width="190" height="130" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="104" y="265" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2933">Input image</text>
  <text x="96" y="302" font-family="Arial, sans-serif" font-size="16" fill="#52606d">inspection photo</text>

  <path d="M274 275 H382" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="404" y="178" width="244" height="194" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="438" y="232" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2933">YOLO coarse router</text>
  <text x="438" y="266" font-family="Arial, sans-serif" font-size="16" fill="#52606d">finds broad regions</text>
  <rect x="438" y="294" width="78" height="44" rx="5" fill="#eef6ff" stroke="#8ab8f4"/>
  <text x="455" y="322" font-family="Arial, sans-serif" font-size="15" fill="#1f2933">ceiling</text>
  <rect x="530" y="294" width="82" height="44" rx="5" fill="#e7f7ee" stroke="#7bc79a"/>
  <text x="546" y="322" font-family="Arial, sans-serif" font-size="15" fill="#1f2933">wall</text>

  <path d="M668 275 H766" stroke="#334e68" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="788" y="120" width="216" height="96" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="824" y="158" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Ceiling model</text>
  <text x="824" y="188" font-family="Arial, sans-serif" font-size="15" fill="#52606d">damage B/C/D</text>
  <rect x="788" y="246" width="216" height="96" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="824" y="284" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Inner wall model</text>
  <text x="824" y="314" font-family="Arial, sans-serif" font-size="15" fill="#52606d">damage B/C/D</text>
  <rect x="788" y="372" width="216" height="96" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="824" y="410" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">RC wall model</text>
  <text x="824" y="440" font-family="Arial, sans-serif" font-size="15" fill="#52606d">damage B/C/D</text>
  <rect x="788" y="498" width="216" height="96" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="824" y="536" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">RC column model</text>
  <text x="824" y="566" font-family="Arial, sans-serif" font-size="15" fill="#52606d">damage B/C/D</text>

  <path d="M1024 168 C1080 168 1082 304 1134 304" stroke="#334e68" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1024 294 H1134" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1024 420 C1080 420 1082 340 1134 340" stroke="#334e68" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1024 546 C1080 546 1082 376 1134 376" stroke="#334e68" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1148" y="276" width="88" height="96" rx="8" fill="#ffffff" stroke="#d7dde7"/>
  <text x="1168" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2933">Fuse</text>
  <text x="1162" y="346" font-family="Arial, sans-serif" font-size="14" fill="#52606d">report</text>

  <rect x="404" y="450" width="244" height="112" rx="8" fill="#fff7f7" stroke="#f1b6b6"/>
  <text x="438" y="492" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Guardrail</text>
  <text x="438" y="524" font-family="Arial, sans-serif" font-size="15" fill="#52606d">low confidence / overlapping classes</text>
  <text x="438" y="548" font-family="Arial, sans-serif" font-size="15" fill="#52606d">can trigger multi-model fallback</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334e68"/>
    </marker>
  </defs>
</svg>
