pipeline:
  router_backend: rfdetr
  router_checkpoint: ../../../../../final_release_20260615/models/rfdetr/router/checkpoint_epoch_023.pth
  router_conf_threshold: 0.00
  router_low_conf_threshold: 0.03
  router_overlap_policy: keep_all
  router_max_det: 12
  router_max_regions: 4
  router_rescue_top_k_if_empty: 1
  dominant_router_class_policy:
    enabled: false
    classes: ["天井"]
    min_confidence: 0.92
    min_area_ratio: 0.38
    min_confidence_margin: 0.10
  region_transport: full_image_filter
  region_padding_ratio: 0.12
  region_filter_mode: center_or_ioa
  region_filter_ioa_threshold: 0.50
  use_full_image_if_area_ratio_ge: 0.85
  save_debug_crops: false

full_image_rescue:
  enabled: false
  router_classes: ["壁类"]
  region_padding_ratio: 0.12
  min_confidence: 0.0
  duplicate_iou_threshold: 0.85
  max_existing_confidence: 0.85

classes:
  router:
    0: 天井
    1: 壁类
    2: RC柱

crack_models:
  ceiling:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/tenjo/tenjo_standard_orig_checkpoint_epoch_009.pth
    thresholds: [0.20, 0.30, 0.30]
  inner_wall:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/inner_wall/inner_wall_checkpoint_epoch_026.pth
    thresholds: [0.35, 0.35, 0.35]
  rc_wall:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/rc_wall/rc_wall_checkpoint_epoch_009.pth
    thresholds: [0.20, 0.35, 0.25]
  rc_column:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/rc_column/checkpoint_epoch_047.pth
    thresholds: [0.40, 0.40, 0.40]
  wall_merged: null

wall_strategy:
  mode: context_select
  fallback: wall_parallel_debug

low_confidence_policy:
  mode: recall_first_raw_small_boxes
  candidate_multi_model_fallback: false
  note: Keep all small raw rc_wall candidates for safety-first visual review.

downstream_empty_fallback:
  enabled: true
  dynamic: true
  min_threshold: 0.03
  step: 0.05
  max_outputs_per_region: 1

crack_merge:
  mode: nms
  same_grade_iou_threshold: 0.90
  cross_grade_iou_threshold: 0.95
  prefer_higher_grade: true
  keep_conflicts_in_debug: true

display_merge:
  enabled: false

final_display_postprocess:
  enabled: true
  collapse_ambiguity:
    enabled: false
    prefer_wall_when_present: true
  cluster_same_family:
    enabled: true
    iou_threshold: 0.35
    ioa_threshold: 0.70
  dominant_router_filter:
    enabled: true
    classes: ["天井", "壁类", "RC柱"]
    min_confidence: 0.90
    min_area_ratio: 0.0
    min_confidence_margin: 0.25

wall_display:
  mode: rule_merged
  raw_source_models: ["inner_wall", "rc_wall"]
  raw_min_confidence: 0.0
  raw_append_if_uncovered: false
  raw_covered_ioa_threshold: 0.80
  raw_covered_iou_threshold: 0.50
  merge_overlapping_display_items: true
  display_cluster_iou_threshold: 0.35
  display_cluster_ioa_threshold: 0.70
  raw_min_confidence_by_model:
    inner_wall: 0.0
    rc_wall: 0.0
  pair_iou_threshold: 0.60
  pair_ioa_threshold: 0.98
  min_single_confidence: 0.20
  min_single_confidence_by_model:
    inner_wall: 0.20
    rc_wall: 0.10
  max_single_groups_per_model: 6
  use_union_bbox_for_pairs: true

final_output_fallback:
  enabled: true
  restore_suppressed: true
  rebuild_wall_display_if_empty: true
  relaxed_wall_pair_iou_threshold: 0.60
  relaxed_wall_pair_ioa_threshold: 0.98
  relaxed_min_single_confidence: 0.10
  relaxed_min_single_confidence_by_model:
    inner_wall: 0.10
    rc_wall: 0.05
  relaxed_max_single_groups_per_model: 8
  relaxed_use_union_bbox_for_pairs: true
  include_merged_candidates: true
  include_raw_candidates: true
  max_outputs: 12

outputs:
  root: ../../../../../outputs/rfdetr_prod_pipeline
  save_jsonl: true
  save_visualizations: true
  save_audit_log: true

conf_threshold: 0.20
iou_threshold: 0.45
