pipeline:
  router_backend: rfdetr
  router_checkpoint: ../../../../../final_release_20260615/models/rfdetr/router/checkpoint_epoch_023.pth
  router_conf_threshold: 0.10
  router_low_conf_threshold: 0.03
  router_overlap_policy: keep_all
  router_max_det: 12
  router_min_region_confidence: 0.10
  router_max_regions: 3
  router_rescue_top_k_if_empty: 1
  dominant_router_class_policy:
    enabled: true
    classes: ["天井"]
    min_confidence: 0.90
    min_area_ratio: 0.35
    min_confidence_margin: 0.09
  region_transport: ndarray_slice
  region_padding_ratio: 0.10
  use_full_image_if_area_ratio_ge: 0.85
  save_debug_crops: false

full_image_rescue:
  enabled: true
  router_classes: ["壁类"]
  region_padding_ratio: 0.10
  min_confidence: 0.0
  duplicate_iou_threshold: 0.70
  max_existing_confidence: 0.50

classes:
  router:
    0: 天井
    1: 壁类
    2: RC柱

crack_models:
  ceiling:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/tenjo/tenjo_standard_orig_checkpoint_epoch_009.pth
    thresholds: [0.30, 0.40, 0.40]
  inner_wall:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/inner_wall/inner_wall_checkpoint_epoch_026.pth
    thresholds: [0.45, 0.45, 0.45]
  rc_wall:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/rc_wall/rc_wall_checkpoint_epoch_009.pth
    thresholds: [0.30, 0.45, 0.35]
  rc_column:
    backend: rfdetr
    checkpoint: ../../../../../final_release_20260615/models/rfdetr/downstream/rc_column/checkpoint_epoch_047.pth
    thresholds: [0.50, 0.50, 0.50]
  wall_merged: null

wall_strategy:
  mode: context_select
  fallback: wall_parallel_debug

low_confidence_policy:
  mode: normal_conservative
  candidate_multi_model_fallback: false
  note: Conservative baseline for end-to-end pipeline optimization; avoid report-style recall-priority thresholds.

crack_merge:
  mode: nms
  same_grade_iou_threshold: 0.50
  cross_grade_iou_threshold: 0.60
  prefer_higher_grade: true
  keep_conflicts_in_debug: true

display_merge:
  enabled: true
  iou_threshold: 0.35
  ioa_threshold: 0.55
  cross_class_ioa_threshold: 0.60

wall_display:
  pair_iou_threshold: 0.55
  pair_ioa_threshold: 0.75
  min_single_confidence: 0.50
  min_single_confidence_by_model:
    inner_wall: 0.50
    rc_wall: 0.45
  max_single_groups_per_model: 1
  use_union_bbox_for_pairs: false

outputs:
  root: ../../../../../outputs/rfdetr_prod_pipeline
  save_jsonl: true
  save_visualizations: true
  save_audit_log: true

conf_threshold: 0.30
iou_threshold: 0.45
