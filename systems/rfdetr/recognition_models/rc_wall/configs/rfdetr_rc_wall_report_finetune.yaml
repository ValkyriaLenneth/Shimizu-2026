dataset:
  name: rfdetr_rc_wall_report_finetune
  dir: data/rfdetr_rc_wall_all_non_legacy_test_v1
  source_yolo_dataset: final_release_20260615/data/final_download_20260526/handoff_20260519/shimizu_20260519_minimal_repro_package/data/final_crack_yolo_20260519/split/rc_wall
  note: RC wall report-protocol fine-tuning view. Test is fixed from data_split.json official rc_wall/test stems.

classes:
  0: 耐震壁の損傷程度B
  1: 耐震壁の損傷程度C
  2: 耐震壁の損傷程度D

selection_policy:
  primary_metric: report_grid / fixed-threshold report metrics under checkpoint reload
  official_targets:
    precision: 0.632
    overall_recall: 0.750
    B_recall: 0.857
    C_recall: 0.500
    D_recall: 0.875
  yolo_reference:
    precision: 0.585
    overall_recall: 0.720
    B_recall: 0.739
    C_recall: 0.680
    D_recall: 0.667
  match_iou: 0.229
  report_reference:
    checkpoint: final_release_20260615/models/rfdetr/downstream/rc_wall/rc_wall_checkpoint_epoch_009.pth
    thresholds_B_C_D: [0.28, 0.45, 0.25]
    precision: 0.632
    recall: 0.750

training_defaults:
  epochs: 10
  num_workers: 8
  eval_interval: 1
  checkpoint_interval: 1
  tensorboard: true
  wandb: false
  run_test: false
  test_each_epoch: false
  save_epoch_pth: true
  trainer_precision: 16-mixed
  external_eval_profiles:
    - name: report_current_thresholds
      evaluator: class_threshold_grid
      threshold_grid: "0.22,0.25,0.28,0.30,0.35,0.40,0.45,0.50"
      selected_thresholds: [0.28, 0.45, 0.25]
      selection: class_thresholds
      iou_threshold: 0.229
      device: cpu
      split: test
      num_classes: 3
    - name: report_recall_priority_thresholds
      evaluator: class_threshold_grid
      threshold_grid: "0.18,0.20,0.22,0.25,0.28,0.30,0.35,0.40,0.45,0.50"
      selected_thresholds: [0.28, 0.45, 0.22]
      selection: class_thresholds
      iou_threshold: 0.229
      device: cpu
      split: test
      num_classes: 3
    - name: report_grid
      evaluator: class_threshold_grid
      threshold_grid: "0.10,0.12,0.15,0.18,0.20,0.22,0.25,0.28,0.30,0.35,0.40,0.45,0.50"
      selection: best_f1
      iou_threshold: 0.229
      device: cpu
      split: test
      num_classes: 3

experiments:
  medium:
    model_size: medium
    batch_size: 28
    grad_accum_steps: 1
    lr: 0.000005
    output_dir: outputs/rfdetr_single_crack/rc_wall_report_e009_ft_lr5e6_res896_10ep
  alt:
    model_size: medium
    batch_size: 28
    grad_accum_steps: 1
    lr: 0.000005
    output_dir: outputs/rfdetr_single_crack/rc_wall_report_e063orig_ft_lr5e6_res896_10ep
